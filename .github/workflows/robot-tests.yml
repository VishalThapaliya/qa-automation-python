name: Robot Framework Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-automation-robotframework
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install webdriver-manager

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Robot Framework tests
        run: robot --outputdir results --variable HEADLESS:True login_test.robot checkout_test.robot price_test.robot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-framework-report
          path: qa-automation-robotframework/results/
          retention-days: 30